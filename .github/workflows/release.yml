# Release workflow for the graphwake agent (GoReleaser): binaries for linux/darwin/windows x amd64/arm64,
# checksums.txt, and the ghcr.io/graphwake/agent image. Triggered by pushing a tag vX.Y.Z; nothing runs until
# someone pushes the first tag.
#
# Where to put it:
#   - In the public github.com/graphwake/agent repository (the agent/ folder as the repo root):
#     copy to .github/workflows/release.yml and set AGENT_DIR to "." below.
#   - In this monorepo: copy to .github/workflows/agent-release.yml as is (AGENT_DIR: agent). Note that the
#     GitHub Action, the GitLab template and the Azure task download from github.com/graphwake/agent releases.
name: agent-release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write   # create the GitHub release
  packages: write   # push the image to ghcr.io

env:
  AGENT_DIR: .

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.AGENT_DIR }}/go.mod

      - name: Test
        working-directory: ${{ env.AGENT_DIR }}
        run: |
          go vet ./...
          go test ./...

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
          workdir: ${{ env.AGENT_DIR }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
